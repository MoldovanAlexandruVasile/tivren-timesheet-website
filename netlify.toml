# Netlify build settings. npm installs @moldovanalexandruvasile/unity-marketing
# from GitHub Packages (.npmrc), so the site needs a NODE_AUTH_TOKEN environment
# variable (a GitHub token with read:packages) under Site configuration →
# Environment variables, with the Builds scope.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Vite gives built files in assets/ a content hash in their name, so a new
# build always uses new names: browsers can keep them for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# One URL per page: Netlify also serves privacy.html at /privacy, so the .html
# forms (and /index.html) 301 to the clean URLs used in canonical tags and the
# sitemap. "force" is needed because the .html files exist.
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/privacy.html"
  to = "/privacy"
  status = 301
  force = true

[[redirects]]
  from = "/terms.html"
  to = "/terms"
  status = 301
  force = true
